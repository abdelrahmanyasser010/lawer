services:
  postgres:
    image: postgres:16-alpine
    container_name: zdraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zdraft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - zdraft_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zdraft"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  zdraft_postgres_data:
